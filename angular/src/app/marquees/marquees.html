<abp-page [title]="'Marquees'">
  <!-- Toolbar -->
  <abp-page-toolbar-container class="col">
    <div class="text-end">
      <button
        id="create"
        class="btn btn-outline-primary btn-sm"
        type="button"
        (click)="createMarquee()"
      >
        <i class="fa fa-plus me-1"></i> New Marquee
      </button>
    </div>
  </abp-page-toolbar-container>

  <!-- Search + Filters -->
  <div class="card">
    <div class="card-body">
      <!-- Top Row -->
      <div class="row mb-2">
        <div class="col-10">
          <div class="input-group">
            <input
              type="text"
              class="form-control"
              placeholder="Search Here"
              [(ngModel)]="filters.filter"
            />
            <button type="button" class="btn btn-primary" (click)="list.get()">
              <i class="fa fa-search"></i>
            </button>
          </div>
        </div>

        <div class="col-2 text-end">
          <button class="btn btn-outline-primary w-100" (click)="showFilter = !showFilter">
            Filters <i class="fas" [ngClass]="showFilter ? 'fa-angle-up' : 'fa-angle-down'"></i>
          </button>
        </div>
      </div>

      <!-- Filter Panel -->
      <div *ngIf="showFilter" class="mt-3">
        <div class="row g-2">
          <!-- Name -->
          <div class="col-sm-4">
            <label>Name</label>
            <input class="form-control form-control-sm" [(ngModel)]="filters.name" />
          </div>

          <!-- Location -->
          <div class="col-sm-4">
            <label>Location</label>
            <input class="form-control form-control-sm" [(ngModel)]="filters.location" />
          </div>

          <!-- Buttons -->
          <div class="col-sm-auto d-flex align-items-end gap-1">
            <button type="button" class="btn btn-sm btn-outline-secondary" (click)="clearFilters()">
              <i class="fas fa-undo"></i> Reset
            </button>

            <button type="button" class="btn btn-primary btn-sm" (click)="list.get()">
              <i class="fa fa-filter"></i> Apply
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="card mt-2">
    <div class="card-body">
      <ngx-datatable [rows]="marquees.items" [count]="marquees.totalCount"  [list]="list" default>
        <!-- ACTIONS -->
        <ngx-datatable-column name="Actions" [maxWidth]="150" [sortable]="false">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <div ngbDropdown container="body">
              <button class="btn btn-primary btn-sm dropdown-toggle" ngbDropdownToggle>
                <i class="fa fa-cog me-1"></i> Actions
              </button>
              <div ngbDropdownMenu>
                <button ngbDropdownItem (click)="editMarquee(row.id)">Edit</button>
                <button ngbDropdownItem (click)="delete(row.id)">Delete</button>
              </div>
            </div>
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column name="Name" prop="name"></ngx-datatable-column>
        <ngx-datatable-column name="Location" prop="location"></ngx-datatable-column>
        <ngx-datatable-column name="Description" prop="description"></ngx-datatable-column>
        <ngx-datatable-column name="Capacity" prop="capacity"></ngx-datatable-column>
        <ngx-datatable-column name="PricePerDay" prop="pricePerDay"></ngx-datatable-column>
      </ngx-datatable>
    </div>
  </div>
</abp-page>

<!-- MODAL -->
<abp-modal [(visible)]="isModalOpen">
  <ng-template #abpHeader>
    <h3>{{ selectedMarquee.id ? 'Edit Marquee' : 'New Marquee' }}</h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Name *</label>
          <input class="form-control" formControlName="name" />
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Location *</label>
          <input class="form-control" formControlName="location" />
        </div>

        <div class="col-md-12 mb-3">
          <label class="form-label">Description</label>
          <input class="form-control" formControlName="description" />
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Capacity *</label>
          <input type="number" class="form-control" formControlName="capacity" />
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Price Per Day *</label>
          <input type="number" class="form-control" formControlName="pricePerDay" />
        </div>
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button class="btn btn-secondary" (click)="isModalOpen=false">Cancel</button>
    <button class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
      <i class="fas fa-check"></i> Save
    </button>
  </ng-template>
</abp-modal>
