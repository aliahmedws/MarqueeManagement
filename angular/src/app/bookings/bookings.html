<abp-page [title]="'::Menu:Bookings' | abpLocalization">

  <!-- Toolbar -->
  <abp-page-toolbar-container class="col">
    <div class="text-end">
      <button id="create" class="btn btn-outline-primary btn-sm" type="button" (click)="createBooking()">
        <i class="fa fa-plus me-1"></i> {{ '::NewBooking' | abpLocalization }}
      </button>
    </div>
  </abp-page-toolbar-container>

  <!-- Search + Filters -->
  <div class="card">
    <div class="card-body">

      <!-- Top Row -->
      <div class="row">
        <div class="col-10">
          <div class="input-group">
            <input type="text" class="form-control" [placeholder]="'::SearchHere' | abpLocalization" [(ngModel)]="filters.filter"/>
            <button type="button" class="btn btn-primary" (click)="list.get()"> <i class="fa fa-search"></i> </button>
          </div>
        </div>

        <div class="col-2 text-end">
          <button class="btn btn-outline-primary w-100" (click)="showFilter = !showFilter"> 
            {{ '::Filters' | abpLocalization }}
            <i class="fas" [ngClass]="showFilter ? 'fa-angle-up' : 'fa-angle-down'"> </i>
          </button>
        </div>
      </div>

      <!-- Filter Panel -->
      <div *ngIf="showFilter" class="mt-3">
        <div class="row g-2">

          <!-- Event Type -->
          <div class="col-sm-4">
            <label>{{ '::EventType' | abpLocalization }}</label>
            <input class="form-control form-control-sm" [(ngModel)]="filters.eventType" />
          </div>

          <!-- Status -->
          <div class="col-sm-4">
            <label>{{ '::Status' | abpLocalization }}</label>
            <input class="form-control form-control-sm" [(ngModel)]="filters.status" />
          </div>

          <!-- Buttons -->
          <div class="col-sm-auto d-flex align-items-end gap-1">
            <button type="button" class="btn btn-sm btn-outline-secondary" (click)="clearFilters()">
              <i class="fas fa-undo"></i> {{ '::Reset' | abpLocalization }} 
            </button>
            <button type="button" class="btn btn-primary btn-sm" (click)="list.get()"> 
              <i class="fa fa-filter"></i> {{ '::Apply' | abpLocalization }} 
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="card mt-2">
    <div class="card-body">

      <ngx-datatable [rows]="bookings.items" [count]="bookings.totalCount" [list]="list" default>

        <!-- ACTIONS -->
        <ngx-datatable-column name="::Actions" [maxWidth]="150" [sortable]="false">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <div ngbDropdown container="body">
              <button class="btn btn-primary btn-sm dropdown-toggle" ngbDropdownToggle>
                <i class="fa fa-cog me-1"></i> {{ '::Actions' | abpLocalization }}
              </button>
              <div ngbDropdownMenu>
                <button *abpPermission="'Bookings.Edit'" ngbDropdownItem (click)="editBooking(row.id)">
                  {{ '::Edit' | abpLocalization }}
                </button>
                <button *abpPermission="'Bookings.Delete'" ngbDropdownItem (click)="delete(row.id)">
                  {{ '::Delete' | abpLocalization }}
                </button>
              </div>
            </div>
          </ng-template>
        </ngx-datatable-column>

        <!-- Event Date Column -->
        <ngx-datatable-column name="::EventDate" prop="eventDate">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ row.eventDate | date:'yyyy-MM-dd' }}
          </ng-template>
        </ngx-datatable-column>
        
        <ngx-datatable-column name="::GuestCount" prop="guestCount"></ngx-datatable-column>
        <ngx-datatable-column name="::EventType" prop="eventType"></ngx-datatable-column>
        <ngx-datatable-column name="::Status" prop="status"></ngx-datatable-column>

      </ngx-datatable>

    </div>
  </div>

</abp-page>

<!-- MODAL -->
<abp-modal [(visible)]="isModalOpen">

  <ng-template #abpHeader>
    <h3 class="text-secondary fw-semibold m-0 fs-3">
      {{ selectedBooking.id ? '::EditBooking' | abpLocalization : '::NewBooking' | abpLocalization }}
    </h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form" class="mt-2" (ngSubmit)="save()">

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="eventDate" class="form-label">{{ '::EventDate' | abpLocalization }} <span class="text-danger">*</span></label>
          <input type="date" id="eventDate" class="form-control" formControlName="eventDate" />
        </div>

        <div class="col-md-6 mb-3">
          <label for="eventType" class="form-label">{{ '::EventType' | abpLocalization }} <span class="text-danger">*</span></label>
          <input id="eventType" class="form-control" formControlName="eventType" />
        </div>

        <div class="col-md-6 mb-3">
          <label for="guestCount" class="form-label">{{ '::GuestCount' | abpLocalization }} <span class="text-danger">*</span></label>
          <input id="guestCount" type="number" class="form-control" formControlName="guestCount" />
        </div>

        <div class="col-md-6 mb-3">
          <label for="status" class="form-label">{{ '::Status' | abpLocalization }} <span class="text-danger">*</span></label>
          <input id="status" class="form-control" formControlName="status" />
        </div>

        <div class="col-md-6 mb-3">
          <label for="totalAmount" class="form-label">{{ '::TotalAmount' | abpLocalization }} <span class="text-danger">*</span></label>
          <input id="totalAmount" type="number" class="form-control" formControlName="totalAmount" />
        </div>

      </div>

    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" (click)="isModalOpen = false">
      {{ '::Cancel' | abpLocalization }}
    </button>
    <button type="submit" class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
      <i class="fas fa-check"></i> {{ '::Save' | abpLocalization }}
    </button>
  </ng-template>

</abp-modal>
